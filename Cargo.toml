[package]
name = "lldp_topology221"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[[bin]]
name = "lldp_topology221"
path = "src/main.rs"

[dependencies]
tokio = { version = "=1.44.2", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
